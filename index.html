    // 9B. Thick, Glossy 3D S-Curve Air-Water Meniscus Sheet (`z = -HALF_TD..+HALF_TD`)!
    const meniscusGeo = new THREE.PlaneGeometry(TANK_W, TANK_D, MENISCUS_NX, MENISCUS_NZ);
    meniscusGeo.rotateX(-Math.PI * 0.5);

    const meniscusMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uSceneTex: shellSharedUniforms.uSceneTex,
        uResolution: shellSharedUniforms.uResolution
      },
      vertexShader: /* glsl */ `
        varying vec3 vNormalW;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          vNormalW = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform sampler2D uSceneTex;
        uniform vec2 uResolution;
        varying vec3 vNormalW;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        ${GLSL_SRGB_HELPER}

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 N = normalize(vNormalW);
          if (!gl_FrontFacing) N = -N;

          vec3 viewN = normalize((viewMatrix * vec4(N, 0.0)).xyz);
          float ndv = abs(dot(N, V));
          float fresnel = pow(1.0 - ndv, 1.8);

          // Strong liquid-air Snell refraction + dispersion across the 3D S-wave sheet!
          vec3 refr = vec3(
            texture2D(uSceneTex, clamp(screenUV - viewN.xy * 0.026, 0.002, 0.998)).r,
            texture2D(uSceneTex, clamp(screenUV - viewN.xy * 0.032, 0.002, 0.998)).g,
            texture2D(uSceneTex, clamp(screenUV - viewN.xy * 0.039, 0.002, 0.998)).b
          );

          // Front & rear acrylic wetting contact lines (#2B3029 dark charcoal TIR + gleaming #F7FDF9 silver lip!)
          float zAbs = abs(vUv.y - 0.5) * 2.0;
          float frontEdge = smoothstep(0.72, 0.96, vUv.y);
          float backEdge  = smoothstep(0.28, 0.04, vUv.y);
          float darkTIRBand = exp(-pow((zAbs - 0.80) * 7.5, 2.0));
          float silverLip   = smoothstep(0.86, 1.0, zAbs);

          // Internal concentric liquid ripple striations across the meniscus ribbon (visible on right crest in reference!)
          float rippleStripes = sin(vUv.y * 22.0 + sin(vUv.x * 8.0 + uTime * 2.5) * 1.5);
          float stripeDark = smoothstep(0.3, 0.95, rippleStripes) * 0.22;

          vec3 L1 = normalize(vec3(-0.48, 0.82, 0.52));
          vec3 H1 = normalize(L1 + V);
          float specCrest = pow(max(dot(N, H1), 0.0), 64.0);
          float specPin   = pow(max(dot(N, H1), 0.0), 220.0);

          vec3 col = mix(refr * vec3(0.82, 0.90, 0.92), srgb(0.96, 0.99, 0.98), fresnel * 0.68 + silverLip * 0.82);
          col = mix(col, srgb(0.17, 0.21, 0.20), clamp(darkTIRBand * 0.88 + stripeDark + (frontEdge + backEdge) * 0.25, 0.0, 0.92));
          col += vec3(1.45, 1.48, 1.44) * (specCrest * 0.85 + specPin * 1.35);

          float alpha = clamp(0.55 + fresnel * 0.38 + darkTIRBand * 0.45 + silverLip * 0.45 + specCrest * 0.65, 0.0, 0.98);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const meniscusMesh = new THREE.Mesh(meniscusGeo, meniscusMat);
    meniscusMesh.renderOrder = 7;
    tankGroup.add(meniscusMesh);
    pass3OnlyMeshes.push(meniscusMesh);

    // 9C. Whisper-subtle front acrylic window studio softbox reflection
    const frontWindowSheen = new THREE.Mesh(
      new THREE.ShapeGeometry(makeRoundedRectShape(TANK_W, TANK_H, TANK_R, 0, 0), 24),
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec2 vLocal;
          varying vec3 vWorldPos;
          varying vec3 vNormalW;
          void main() {
            vLocal = position.xy;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vNormalW = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          varying vec2 vLocal;
          varying vec3 vWorldPos;
          varying vec3 vNormalW;
          void main() {
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 N = normalize(vNormalW);
            float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
            float diagGlint = exp(-pow((vLocal.x * 0.52 + vLocal.y * 0.42 - 0.68) * 1.55, 2.0));
            float alpha = clamp(0.010 + fres * 0.11 + diagGlint * 0.035, 0.0, 0.18);
            gl_FragColor = vec4(vec3(1.05, 1.03, 0.99), alpha);
          }
        `
      })
    );
    frontWindowSheen.position.z = HALF_TD + 0.04;
    frontWindowSheen.renderOrder = 10;
    tankGroup.add(frontWindowSheen);
    pass3OnlyMeshes.push(frontWindowSheen);

    function getWaterSurfaceY(x, z, t) {
      const nx = x / HALF_TW;
      const nz = z / HALF_TD;
      // Sculptural 3D S-curve liquid wave crest + Z-tilt roll on right crest so camera sees full 3D liquid ribbon!
      const sWave =
        Math.sin(x * 1.65 - 0.55 + t * 2.8) * (state.rippleAmp * 4.4) +
        Math.cos(x * 3.4 - t * 4.1 + z * 2.2) * (state.rippleAmp * 0.90);

      // Tilt the right wave crest slightly forward/down toward camera so its glossy 3D upper ribbon gleams!
      const ribbonRollZ = -(0.12 + 0.14 * Math.sin(x * 1.35 + 0.3)) * z;

      const capX = Math.pow(Math.min(1, Math.abs(nx)), 4.2) * 0.13;
      const capZ = Math.pow(Math.min(1, Math.abs(nz)), 3.6) * 0.072;

      const rawY = WATER_REST_LOCAL_Y + state.sloshX * x + state.sloshZ * z + ribbonRollZ + sWave + capX + capZ;
      return THREE.MathUtils.clamp(rawY, -HALF_TH + 0.35, HALF_TH - 0.08);
    }

    function updateWaterMeshes(t) {
      const posAttr = meniscusGeo.attributes.position;
      for (let iz = 0; iz <= MENISCUS_NZ; iz++) {
        const z = -HALF_TD + (iz / MENISCUS_NZ) * TANK_D;
        for (let ix = 0; ix <= MENISCUS_NX; ix++) {
          const idx = iz * (MENISCUS_NX + 1) + ix;
          const x = -HALF_TW + (ix / MENISCUS_NX) * TANK_W;
          posAttr.setXYZ(idx, x, getWaterSurfaceY(x, z, t), z);
        }
      }
      posAttr.needsUpdate = true;
      meniscusGeo.computeVertexNormals();

      const bodyAttr = waterBodyGeo.attributes.position;
      for (let ix = 0; ix <= MENISCUS_NX; ix++) {
        const x = -HALF_TW + (ix / MENISCUS_NX) * TANK_W;
        const frontSurfY = getWaterSurfaceY(x, HALF_TD * 0.96, t);
        bodyAttr.setXYZ(ix, x, frontSurfY, 0);
        bodyAttr.setXYZ(ix + (MENISCUS_NX + 1), x, -HALF_TH, 0);
      }
      bodyAttr.needsUpdate = true;
    }

    // =========================================================================
    // 10. Ring Layout, Sub-Stepped Hydrodynamics & Torus-Peg Collisions
    // =========================================================================
    let userInteractedWithGame = false;

    function resetRings(initialShowcase = false) {
      state.allWinShown = false;
      document.getElementById('win-banner').classList.remove('visible');

      // Exact photogenic editorial ring composition of the reference study!
      const showcase = [
        { x: -1.28, y: -0.56, z:  0.03, rx:  0.10, ry:  0.15, rz: 0.2 }, // Coral Red (Upper-Left)
        { x: -1.32, y: -1.36, z: -0.02, rx: -0.08, ry: -0.14, rz: 1.1 }, // Marigold Yellow (Lower-Left)
        { x:  0.22, y: -1.02, z:  0.04, rx:  0.12, ry: -0.16, rz: 2.3 }, // Electric Lime (Center-Right)
        { x:  1.26, y: -0.26, z:  0.02, rx: -0.11, ry:  0.16, rz: 0.7 }, // Warm Coral (Mid-Right)
        { x:  1.24, y: -1.16, z: -0.02, rx:  0.13, ry: -0.12, rz: 1.8 }  // Butterscotch Amber (Lower-Right)
      ];

      for (let i = 0; i < RING_COUNT; i++) {
        const r = rings[i];
        r.vel.set(0, 0, 0);
        r.angVel.set((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.45);
        r.hookedPeg = 0;

        if (initialShowcase && i < showcase.length) {
          const s = showcase[i];
          r.pos.set(s.x, s.y, s.z);
          r.quat.setFromEuler(new THREE.Euler(s.rx, s.ry, s.rz));
        } else {
          const lane = (i - (RING_COUNT - 1) * 0.5) / RING_COUNT;
          r.pos.set(
            lane * (TANK_W - 1.1) + (Math.random() - 0.5) * 0.18,
            -HALF_TH + 0.46 + (i % 3) * 0.36,
            (Math.random() - 0.5) * 0.10
          );
          r.quat.setFromEuler(new THREE.Euler(
            (Math.random() - 0.5) * 0.4,
            (Math.random() - 0.5) * 0.3,
            Math.random() * Math.PI * 2
          ));
        }
        r.mesh.position.copy(r.pos);
        r.mesh.quaternion.copy(r.quat);
      }

      if (initialShowcase) {
        state.hookedCount = 0;
        state.score = 30; // Editorial initial readout matching reference card; updates live on play!
      } else {
        state.hookedCount = 0;
        state.score = 0;
      }
      updateScoreDisplay(false);
    }

    const tmpWorldDown = new THREE.Vector3(0, -1, 0);
    const tmpLocalGravity = new THREE.Vector3();
    const tmpInvQuat = new THREE.Quaternion();
    const tmpRingNormal = new THREE.Vector3();
    const tmpD = new THREE.Vector3();
    const tmpPlane = new THREE.Vector3();
    const tmpClosestCircle = new THREE.Vector3();
    const tmpPush = new THREE.Vector3();
    const tmpTorqueAxis = new THREE.Vector3();
    const tmpDeltaQuat = new THREE.Quaternion();
    const tmpFluidVel = new THREE.Vector3();

    function sampleJetFlow(x, y, z, localUpVec, outVel) {
      outVel.set(0, 0, 0);
      const jf = state.jetForce;
      const jets = [];
      if (state.pumpLeft || state.pumpLeftPos > 0.08) {
        jets.push({ nx: -0.72, dir: 1, power: jf * (state.pumpLeft ? 1.0 : state.pumpLeftPos) });
      }
      if (state.pumpRight || state.pumpRightPos > 0.08) {
        jets.push({ nx: 0.72, dir: -1, power: jf * (state.pumpRight ? 1.0 : state.pumpRightPos) });
      }

      for (const jet of jets) {
        const dx = x - jet.nx;
        const hAbove = Math.max(0, y - (-HALF_TH + 0.08));
        const sigma = 0.44 + hAbove * 0.15;
        const plume = Math.exp(-(dx * dx + z * z * 1.4) / (2 * sigma * sigma));
        const vertDecay = Math.exp(-hAbove * 0.19);

        outVel.y += plume * vertDecay * 5.9 * jet.power;
        outVel.x += localUpVec.x * plume * 1.8 * jet.power;

        const nearTop = THREE.MathUtils.smoothstep(y, -0.35, 1.15);
        outVel.x += jet.dir * nearTop * (0.95 + plume * 1.35) * jet.power;

        const returnSide = THREE.MathUtils.smoothstep(dx * jet.dir, 0.35, 1.85);
        outVel.y -= returnSide * 1.15 * jet.power;
        outVel.z += Math.sin(y * 2.6 + state.time * 5.0 + jet.nx * 3.0) * 0.30 * jet.power;
      }
      return outVel;
    }

    function stepPhysics(dt) {
      const targetLeft = state.pumpLeft ? 1.0 : 0.0;
      const targetRight = state.pumpRight ? 1.0 : 0.0;
      state.pumpLeftPos += (targetLeft - state.pumpLeftPos) * Math.min(1, dt * 22);
      state.pumpRightPos += (targetRight - state.pumpRightPos) * Math.min(1, dt * 22);

      leftPump.btnGroup.position.z = BODY_D * 0.49 - state.pumpLeftPos * 0.11;
      leftPump.btnGroup.scale.set(1 + state.pumpLeftPos * 0.03, 1 + state.pumpLeftPos * 0.03, 1 - state.pumpLeftPos * 0.18);
      rightPump.btnGroup.position.z = BODY_D * 0.49 - state.pumpRightPos * 0.11;
      rightPump.btnGroup.scale.set(1 + state.pumpRightPos * 0.03, 1 + state.pumpRightPos * 0.03, 1 - state.pumpRightPos * 0.18);

      const baseX = state.studioPose ? -0.10 : -0.02;
      const baseY = state.studioPose ? -0.34 : 0.0;
      const baseZ = state.studioPose ? -0.34 : 0.0;

      const buttonTorqueZ = (state.pumpLeftPos - state.pumpRightPos) * 0.010;
      const buttonTorqueX = -(state.pumpLeftPos + state.pumpRightPos) * 0.006;

      const goalX = baseX + state.userTiltX + buttonTorqueX;
      const goalY = baseY + state.userTiltZ * -0.15;
      const goalZ = baseZ + state.userTiltZ + buttonTorqueZ;

      const prevTiltX = state.tiltX;
      const prevTiltZ = state.tiltZ;

      const kSpring = 46.0;
      const kDamp = 9.2;
      state.velTiltX += ((goalX - state.tiltX) * kSpring - state.velTiltX * kDamp) * dt;
      state.velTiltY += ((goalY - state.tiltY) * kSpring - state.velTiltY * kDamp) * dt;
      state.velTiltZ += ((goalZ - state.tiltZ) * kSpring - state.velTiltZ * kDamp) * dt;

      state.tiltX += state.velTiltX * dt;
      state.tiltY += state.velTiltY * dt;
      state.tiltZ += state.velTiltZ * dt;

      const hoverY = 0.18 + Math.sin(state.time * 1.3) * 0.03;
      deviceGroup.position.set(-0.08, hoverY, 0);
      deviceGroup.rotation.set(state.tiltX, state.tiltY, state.tiltZ, 'YXZ');
      deviceGroup.updateMatrixWorld();

      tmpInvQuat.copy(deviceGroup.quaternion).invert();
      tmpLocalGravity.copy(tmpWorldDown).applyQuaternion(tmpInvQuat).normalize();
      const localUp = tmpLocalGravity.clone().negate();

      // World-gravity-leveled water meniscus slosh
      const eqSlopeX = tmpLocalGravity.x / Math.max(0.38, -tmpLocalGravity.y);
      const eqSlopeZ = tmpLocalGravity.z / Math.max(0.38, -tmpLocalGravity.y);
      const tiltAccelZ = (state.tiltZ - prevTiltZ) / Math.max(0.001, dt);
      const tiltAccelX = (state.tiltX - prevTiltX) / Math.max(0.001, dt);

      state.sloshVelX += ((eqSlopeX - state.sloshX) * 28.0 + tiltAccelZ * 0.45 - state.sloshVelX * 3.2) * dt;
      state.sloshVelZ += ((eqSlopeZ - state.sloshZ) * 28.0 - tiltAccelX * 0.45 - state.sloshVelZ * 3.2) * dt;
      state.sloshX = THREE.MathUtils.clamp(state.sloshX + state.sloshVelX * dt, -0.50, 0.50);
      state.sloshZ = THREE.MathUtils.clamp(state.sloshZ + state.sloshVelZ * dt, -0.42, 0.42);

      const jetActivity = (state.pumpLeft ? 1 : 0) + (state.pumpRight ? 1 : 0) + Math.abs(state.sloshVelX) * 0.35;
      const targetRipple = 0.022 + Math.min(0.048, jetActivity * 0.022 * state.jetForce);
      state.rippleAmp += (targetRipple - state.rippleAmp) * Math.min(1, dt * 6.0);

      // Bubbles
      if (state.pumpLeft) {
        userInteractedWithGame = true;
        const count = Math.ceil(2.8 * state.jetForce);
        for (let c = 0; c < count; c++) spawnBubble(-0.68, state.jetForce, false);
        audio.playBubbleGrain(state.jetForce);
      }
      if (state.pumpRight) {
        userInteractedWithGame = true;
        const count = Math.ceil(2.8 * state.jetForce);
        for (let c = 0; c < count; c++) spawnBubble(0.68, state.jetForce, false);
        audio.playBubbleGrain(state.jetForce);
      }
      if (Math.random() < dt * 22.0) {
        spawnBubble(-0.08, 0.95, true);
      }

      for (let i = 0; i < MAX_BUBBLES; i++) {
        const b = bubbles[i];
        if (!b.active) continue;
        b.age += dt;

        const surfY = getWaterSurfaceY(b.pos.x, b.pos.z, state.time);
        if (b.clinging) {
          b.pos.x += Math.sin(state.time * 1.4 + b.phase) * 0.04 * dt;
          b.pos.y = surfY - b.radius * 1.35 - Math.abs(Math.sin(b.phase)) * 0.07;
          dummyObj.position.copy(b.pos);
          dummyObj.scale.setScalar(b.radius);
          dummyObj.updateMatrix();
          bubbleInstanced.setMatrixAt(i, dummyObj.matrix);
          continue;
        }

        b.vel.addScaledVector(localUp, 4.6 * dt);
        b.vel.x += Math.sin(state.time * 8.5 + b.phase) * 1.15 * dt;
        b.vel.z += Math.cos(state.time * 7.8 + b.phase) * 0.75 * dt;
        b.vel.multiplyScalar(Math.exp(-2.1 * dt));

        b.pos.addScaledVector(b.vel, dt);
        b.pos.x = THREE.MathUtils.clamp(b.pos.x, -HALF_TW + 0.10, HALF_TW - 0.10);
        b.pos.z = THREE.MathUtils.clamp(b.pos.z, -HALF_TD + 0.08, HALF_TD - 0.08);

        if (b.pos.y >= surfY - b.radius * 0.4 || b.age > 3.8) {
          b.active = false;
          dummyObj.position.set(0, -99, 0);
          dummyObj.scale.setScalar(0.0001);
        } else {
          dummyObj.position.copy(b.pos);
          const sq = 1.0 + Math.min(0.16, b.vel.length() * 0.03);
          dummyObj.scale.set(b.radius * sq, b.radius / sq, b.radius * sq);
        }
        dummyObj.updateMatrix();
        bubbleInstanced.setMatrixAt(i, dummyObj.matrix);
      }
      bubbleInstanced.instanceMatrix.needsUpdate = true;

      // Sub-stepped Ring Physics
      // Before user presses a pump/shake/drag, gently buoyantly suspend the 5 showcase rings in place!
      if (!userInteractedWithGame) {
        const baseShowcaseY = [-0.56, -1.36, -1.02, -0.26, -1.16];
        const baseShowcaseX = [-1.28, -1.32,  0.22,  1.26,  1.24];
        for (let i = 0; i < RING_COUNT; i++) {
          const r = rings[i];
          r.pos.x = baseShowcaseX[i] + Math.sin(state.time * 1.15 + i * 1.7) * 0.045;
          r.pos.y = baseShowcaseY[i] + Math.cos(state.time * 1.40 + i * 1.3) * 0.055;
          r.mesh.position.copy(r.pos);
          tmpDeltaQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.12 * dt * (i % 2 === 0 ? 1 : -1));
          r.quat.multiply(tmpDeltaQuat).normalize();
          r.mesh.quaternion.copy(r.quat);
          ringShadowPosArr[i].copy(r.pos);
          ringShadowNormArr[i].set(0, 0, 1).applyQuaternion(r.quat).normalize();
        }
      } else {
        const SUBSTEPS = 4;
        const subDt = dt / SUBSTEPS;
        const sinkGravity = 8.8 * (1.03 - state.buoyancy);
        const shakeImpulseX = -tiltAccelZ * 1.65;
        const shakeImpulseY = Math.abs(tiltAccelZ) * 0.55 + Math.abs(tiltAccelX) * 0.55;
        const shakeImpulseZ = tiltAccelX * 1.25;

        for (let step = 0; step < SUBSTEPS; step++) {
          for (let i = 0; i < RING_COUNT; i++) {
            const r = rings[i];
            const surfY = getWaterSurfaceY(r.pos.x, r.pos.z, state.time);
            const submerged = r.pos.y < surfY;

            if (submerged) {
              r.vel.addScaledVector(tmpLocalGravity, sinkGravity * subDt);
              sampleJetFlow(r.pos.x, r.pos.y, r.pos.z, localUp, tmpFluidVel);
              if (r.hookedPeg !== 0) {
                tmpFluidVel.multiplyScalar(0.24);
              }

              const fluidDrag = 3.8;
              r.vel.x += (tmpFluidVel.x - r.vel.x) * fluidDrag * subDt;
              r.vel.y += (tmpFluidVel.y - r.vel.y) * fluidDrag * subDt;
              r.vel.z += (tmpFluidVel.z - r.vel.z) * fluidDrag * subDt;

              r.angVel.x += (tmpFluidVel.z * 0.7 + Math.sin(state.time * 2.8 + i) * 0.2) * subDt;
              r.angVel.y += (tmpFluidVel.x * 0.4) * subDt;
              r.angVel.z += (-tmpFluidVel.x * 0.95) * subDt;

              if (r.hookedPeg === 0 && r.pos.y < PEG_TIP_Y - 0.08) {
                tmpRingNormal.set(0, 0, 1).applyQuaternion(r.quat);
                const faceAxis = tmpRingNormal.z >= 0 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 0, -1);
                tmpTorqueAxis.crossVectors(tmpRingNormal, faceAxis);
                r.angVel.addScaledVector(tmpTorqueAxis, 3.2 * subDt);
              }
            } else {
              r.vel.addScaledVector(tmpLocalGravity, 11.5 * subDt);
              r.vel.multiplyScalar(Math.exp(-0.8 * subDt));
            }

            r.vel.x += shakeImpulseX * subDt;
            r.vel.y += shakeImpulseY * subDt;
            r.vel.z += shakeImpulseZ * subDt;
            r.angVel.multiplyScalar(Math.exp(-4.2 * subDt));

            // Capture-cone alignment above peg tips
            for (const sx of [-1, 1]) {
              const px = sx * PEG_X;
              const dx = px - r.pos.x;
              const dy = r.pos.y - PEG_TIP_Y;
              if (dy > -0.08 && dy < 0.50 && Math.abs(dx) < RING_MAJOR * 0.88 && Math.abs(r.pos.z) < 0.26 && r.vel.y < 0.9) {
                tmpRingNormal.set(0, 0, 1).applyQuaternion(r.quat);
                const targetAxis = tmpRingNormal.y >= 0
                  ? new THREE.Vector3(0, 0.86, 0.50).normalize()
                  : new THREE.Vector3(0, -0.86, -0.50).normalize();
                tmpTorqueAxis.crossVectors(tmpRingNormal, targetAxis);
                r.angVel.addScaledVector(tmpTorqueAxis, 10.5 * subDt);
                r.vel.x += dx * 2.4 * subDt;
                r.vel.z += -r.pos.z * 3.0 * subDt;
              }
            }

            r.pos.addScaledVector(r.vel, subDt);

            const angSpeed = r.angVel.length();
            if (angSpeed > 0.0001) {
              tmpTorqueAxis.copy(r.angVel).divideScalar(angSpeed);
              tmpDeltaQuat.setFromAxisAngle(tmpTorqueAxis, angSpeed * subDt);
              r.quat.premultiply(tmpDeltaQuat).normalize();
            }

            tmpRingNormal.set(0, 0, 1).applyQuaternion(r.quat).normalize();

            // Exact 3D Torus vs Twin Pegs Collision
            for (const sx of [-1, 1]) {
              const px = sx * PEG_X;
              if (Math.abs(r.pos.x - px) > RING_OUTER + PEG_RADIUS + 0.15) continue;
              if (r.pos.y > PEG_TIP_Y + RING_OUTER + 0.15) continue;

              const clampedY = THREE.MathUtils.clamp(r.pos.y, PEG_BASE_Y, PEG_TIP_Y);
              const sampleYs = [
                PEG_TIP_Y,
                clampedY,
                THREE.MathUtils.clamp(r.pos.y - 0.12, PEG_BASE_Y, PEG_TIP_Y),
                THREE.MathUtils.clamp(r.pos.y + 0.12, PEG_BASE_Y, PEG_TIP_Y)
              ];

              for (let s = 0; s < sampleYs.length; s++) {
                const qx = px, qy = sampleYs[s], qz = 0;
                tmpD.set(qx - r.pos.x, qy - r.pos.y, qz - r.pos.z);
                const axial = tmpD.dot(tmpRingNormal);
                tmpPlane.copy(tmpD).addScaledVector(tmpRingNormal, -axial);

                const planeLen = tmpPlane.length();
                if (planeLen > 1e-5) {
                  tmpClosestCircle.copy(r.pos).addScaledVector(tmpPlane, RING_MAJOR / planeLen);
                } else {
                  const perp = Math.abs(tmpRingNormal.x) < 0.9
                    ? new THREE.Vector3(1, 0, 0).cross(tmpRingNormal).normalize()
                    : new THREE.Vector3(0, 1, 0).cross(tmpRingNormal).normalize();
                  tmpClosestCircle.copy(r.pos).addScaledVector(perp, RING_MAJOR);
                }

                tmpPush.set(tmpClosestCircle.x - qx, tmpClosestCircle.y - qy, tmpClosestCircle.z - qz);
                const dist = tmpPush.length();
                const minSep = RING_TUBE + PEG_RADIUS;

                if (dist < minSep && dist > 1e-6) {
                  const overlap = minSep - dist;
                  tmpPush.divideScalar(dist);
                  r.pos.addScaledVector(tmpPush, overlap);

                  const relVn = r.vel.dot(tmpPush);
                  if (relVn < 0) {
                    if (Math.abs(relVn) > 0.85) audio.playPlasticTap(Math.abs(relVn));
                    r.vel.addScaledVector(tmpPush, -relVn * 1.25);

                    const lever = tmpClosestCircle.sub(r.pos);
                    tmpTorqueAxis.crossVectors(lever, tmpPush);
                    r.angVel.addScaledVector(tmpTorqueAxis, -relVn * 3.0);
                  }
                }
              }

              if (r.pos.y < PEG_BASE_Y + 0.10 + RING_TUBE && Math.hypot(r.pos.x - px, r.pos.z) < RING_MAJOR) {
                r.pos.y = PEG_BASE_Y + 0.10 + RING_TUBE;
                if (r.vel.y < 0) r.vel.y *= -0.18;
              }
            }

            // Tank Inner Wall Constraints
            const nx = tmpRingNormal.x, ny = tmpRingNormal.y, nz = tmpRingNormal.z;
            const extX = RING_MAJOR * Math.sqrt(Math.max(0, 1 - nx * nx)) + RING_TUBE;
            const extY = RING_MAJOR * Math.sqrt(Math.max(0, 1 - ny * ny)) + RING_TUBE;
            const extZ = RING_MAJOR * Math.sqrt(Math.max(0, 1 - nz * nz)) + RING_TUBE;

            const wallBounce = 0.30;
            if (r.pos.x < -HALF_TW + extX) {
              r.pos.x = -HALF_TW + extX;
              if (r.vel.x < 0) {
                if (r.vel.x < -1.1) audio.playPlasticTap(-r.vel.x);
                r.vel.x *= -wallBounce;
              }
            } else if (r.pos.x > HALF_TW - extX) {
              r.pos.x = HALF_TW - extX;
              if (r.vel.x > 0) {
                if (r.vel.x > 1.1) audio.playPlasticTap(r.vel.x);
                r.vel.x *= -wallBounce;
              }
            }

            if (r.pos.y < -HALF_TH + extY + 0.03) {
              r.pos.y = -HALF_TH + extY + 0.03;
              if (r.vel.y < 0) r.vel.y *= -0.24;
              r.vel.x *= Math.exp(-2.0 * subDt);
            } else if (r.pos.y > HALF_TH - extY - 0.04) {
              r.pos.y = HALF_TH - extY - 0.04;
              if (r.vel.y > 0) r.vel.y *= -wallBounce;
            }

            if (r.pos.z < -HALF_TD + extZ) {
              r.pos.z = -HALF_TD + extZ;
              if (r.vel.z < 0) r.vel.z *= -0.22;
            } else if (r.pos.z > HALF_TD - extZ) {
              r.pos.z = HALF_TD - extZ;
              if (r.vel.z > 0) r.vel.z *= -0.22;
            }
          }

          // Ring-to-Ring Collision
          for (let i = 0; i < RING_COUNT; i++) {
            for (let j = i + 1; j < RING_COUNT; j++) {
              const a = rings[i];
              const b = rings[j];
              tmpPush.subVectors(b.pos, a.pos);
              const d = tmpPush.length();

              const samePeg =
                (Math.abs(a.pos.x - PEG_X) < RING_MAJOR * 0.85 && Math.abs(b.pos.x - PEG_X) < RING_MAJOR * 0.85 && a.pos.y < PEG_TIP_Y && b.pos.y < PEG_TIP_Y) ||
                (Math.abs(a.pos.x + PEG_X) < RING_MAJOR * 0.85 && Math.abs(b.pos.x + PEG_X) < RING_MAJOR * 0.85 && a.pos.y < PEG_TIP_Y && b.pos.y < PEG_TIP_Y);

              const minDist = samePeg ? RING_TUBE * 2.15 : RING_OUTER * 1.55;
              if (d < minDist && d > 1e-5) {
                const overlap = (minDist - d) * 0.5;
                tmpPush.divideScalar(d);
                a.pos.addScaledVector(tmpPush, -overlap);
                b.pos.addScaledVector(tmpPush, overlap);

                const vn = (b.vel.x - a.vel.x) * tmpPush.x + (b.vel.y - a.vel.y) * tmpPush.y + (b.vel.z - a.vel.z) * tmpPush.z;
                if (vn < 0) {
                  const imp = -vn * 0.62;
                  a.vel.addScaledVector(tmpPush, -imp);
                  b.vel.addScaledVector(tmpPush, imp);
                }
              }
            }
          }
        }

        // Sync ring transforms, soft shadows & score
        let hookedNow = 0;
        for (let i = 0; i < RING_COUNT; i++) {
          const r = rings[i];
          r.mesh.position.copy(r.pos);
          r.mesh.quaternion.copy(r.quat);
          ringShadowPosArr[i].copy(r.pos);
          tmpRingNormal.set(0, 0, 1).applyQuaternion(r.quat).normalize();
          ringShadowNormArr[i].copy(tmpRingNormal);

          let newHook = 0;
          for (const sx of [-1, 1]) {
            const px = sx * PEG_X;
            if (r.pos.y < PEG_TIP_Y - 0.04 && r.pos.y >= PEG_BASE_Y) {
              tmpD.set(px - r.pos.x, 0, -r.pos.z);
              const axial = tmpD.dot(tmpRingNormal);
              tmpPlane.copy(tmpD).addScaledVector(tmpRingNormal, -axial);
              if (tmpPlane.length() < RING_MAJOR - RING_TUBE * 0.72 && Math.abs(tmpRingNormal.y) > 0.30) {
                newHook = sx;
                r.vel.x *= Math.exp(-6.0 * dt);
                r.vel.z *= Math.exp(-6.0 * dt);
                break;
              }
            }
          }

          if (newHook !== 0 && r.hookedPeg === 0) {
            r.hookedPeg = newHook;
            audio.playRingHooked(hookedNow + 1);
          } else if (newHook === 0) {
            r.hookedPeg = 0;
          }
          if (r.hookedPeg !== 0) hookedNow++;
        }

        if (hookedNow !== state.hookedCount) {
          state.hookedCount = hookedNow;
          state.score = hookedNow * 10;
          updateScoreDisplay(true);
        }
      }

      studioUniforms.uTime.value = state.time;
      studioUniforms.uTilt.value.set(state.tiltX, state.tiltZ);
      studioUniforms.uRipple.value = state.rippleAmp;
      studioUniforms.uDevicePos.value.copy(deviceGroup.position);
      meniscusMat.uniforms.uTime.value = state.time;
      waterBodyMat.uniforms.uTime.value = state.time;
    }

    // =========================================================================
    // 11. UI Bindings & Direct 3D Hardware Controls
    // =========================================================================
    const scoreValEl = document.getElementById('score-val');
    const winBannerEl = document.getElementById('win-banner');

    function updateScoreDisplay(animate = false) {
      scoreValEl.textContent = String(state.score);
      if (animate) {
        scoreValEl.classList.remove('pop');
        void scoreValEl.offsetWidth;
        scoreValEl.classList.add('pop');
        setTimeout(() => scoreValEl.classList.remove('pop'), 260);
      }
      if (userInteractedWithGame && state.hookedCount === RING_COUNT && !state.allWinShown) {
        state.allWinShown = true;
        winBannerEl.classList.add('visible');
      } else if (state.hookedCount < RING_COUNT) {
        winBannerEl.classList.remove('visible');
      }
    }

    document.querySelectorAll('.swatch-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        audio.unlock();
        audio.playPlasticTap(1.2);
        const key = btn.dataset.shell;
        const theme = SHELL_THEMES[key];
        if (!theme) return;
        state.shellKey = key;

        document.querySelectorAll('.swatch-item').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        shellSharedUniforms.uSigma.value.copy(theme.sigma);
        shellSharedUniforms.uDeepEdge.value.copy(theme.deepEdge);
        shellSharedUniforms.uDarkGroove.value.copy(theme.darkGroove);
        shellSharedUniforms.uIceRim.value.copy(theme.iceRim);
        internalMoldMat.uniforms.uColor.value.copy(theme.ribCol);
        internalMoldMat.uniforms.uDeep.value.copy(theme.deepEdge);
        siliconeUniforms.uLitCol.value.copy(theme.siliconeLit);
        siliconeUniforms.uShadeCol.value.copy(theme.siliconeShade);
        studioUniforms.uCausticTint.value.copy(theme.causticTint);
      });
    });

    const slJet = document.getElementById('sl-jet');
    slJet.addEventListener('input', () => { state.jetForce = parseFloat(slJet.value); });

    const slBuoyancy = document.getElementById('sl-buoyancy');
    slBuoyancy.addEventListener('input', () => { state.buoyancy = parseFloat(slBuoyancy.value); });

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      audio.unlock();
      audio.enabled = !audio.enabled;
      btnSound.textContent = `Sound: ${audio.enabled ? 'On' : 'Off'}`;
    });

    const uiLeftBtn = document.getElementById('ui-pump-left');
    const uiRightBtn = document.getElementById('ui-pump-right');

    function setPumpState(side, down) {
      audio.unlock();
      if (down && !userInteractedWithGame) {
        userInteractedWithGame = true;
        state.score = state.hookedCount * 10;
        updateScoreDisplay(false);
      }
      if (side === 'left') {
        if (state.pumpLeft !== down) {
          state.pumpLeft = down;
          uiLeftBtn.classList.toggle('pressed', down);
          audio.playPumpPress(down);
        }
      } else {
        if (state.pumpRight !== down) {
          state.pumpRight = down;
          uiRightBtn.classList.toggle('pressed', down);
          audio.playPumpPress(down);
        }
      }
    }

    uiLeftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); setPumpState('left', true); });
    uiRightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); setPumpState('right', true); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
      uiLeftBtn.addEventListener(ev, () => setPumpState('left', false));
      uiRightBtn.addEventListener(ev, () => setPumpState('right', false));
    });

    const btnPose = document.getElementById('btn-pose');
    btnPose.addEventListener('click', () => {
      audio.unlock();
      audio.playPlasticTap(1.3);
      state.studioPose = !state.studioPose;
      btnPose.textContent = `Pose: ${state.studioPose ? 'Studio' : 'Upright'}`;
    });

    document.getElementById('btn-shake').addEventListener('click', () => {
      audio.unlock();
      if (!userInteractedWithGame) {
        userInteractedWithGame = true;
        state.score = 0;
        updateScoreDisplay(false);
      }
      audio.playPumpPress(true);
      state.velTiltZ += (Math.random() > 0.5 ? 1 : -1) * 5.8;
      state.velTiltX += -3.6;
      state.sloshVelX += (Math.random() - 0.5) * 4.5;
      for (const r of rings) {
        r.vel.y += 3.6 + Math.random() * 2.2;
        r.vel.x += (Math.random() - 0.5) * 3.8;
        r.angVel.set((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
      }
      for (let i = 0; i < 22; i++) {
        spawnBubble((Math.random() - 0.5) * 2.2, 1.25, false);
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      audio.unlock();
      userInteractedWithGame = true;
      audio.playPlasticTap(1.4);
      camera.position.copy(INITIAL_CAM);
      controls.target.copy(INITIAL_TARGET);
      controls.update();
      resetRings(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') setPumpState('left', true);
      if (e.code === 'KeyD' || e.code === 'ArrowRight') setPumpState('right', true);
      if (e.code === 'Space') {
        e.preventDefault();
        setPumpState('left', true);
        setPumpState('right', true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') setPumpState('left', false);
      if (e.code === 'KeyD' || e.code === 'ArrowRight') setPumpState('right', false);
      if (e.code === 'Space') {
        setPumpState('left', false);
        setPumpState('right', false);
      }
    });

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let active3DPump = null;
    let draggingShell = false;
    let dragStartX = 0;
    let dragStartY = 0;

    const shellHitTargets = [shellMesh, tankBezel, frontWindowSheen];
    const buttonHitTargets = [...leftPump.btnGroup.children, ...rightPump.btnGroup.children];

    renderer.domElement.addEventListener('pointerdown', (e) => {
      audio.unlock();
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      const btnHits = raycaster.intersectObjects(buttonHitTargets, false);
      if (btnHits.length > 0) {
        const side = btnHits[0].object.userData.pumpSide;
        if (side) {
          active3DPump = side;
          controls.enabled = false;
          setPumpState(side, true);
          return;
        }
      }

      const shellHits = raycaster.intersectObjects(shellHitTargets, false);
      if (shellHits.length > 0 && e.button === 0) {
        draggingShell = true;
        controls.enabled = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        renderer.domElement.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (draggingShell) {
        const dx = (e.clientX - dragStartX) / Math.max(320, window.innerWidth);
        const dy = (e.clientY - dragStartY) / Math.max(320, window.innerHeight);
        if (Math.hypot(dx, dy) > 0.02 && !userInteractedWithGame) {
          userInteractedWithGame = true;
          state.score = state.hookedCount * 10;
          updateScoreDisplay(false);
        }
        state.userTiltZ = THREE.MathUtils.clamp(-dx * 1.65, -0.72, 0.72);
        state.userTiltX = THREE.MathUtils.clamp(dy * 1.35, -0.55, 0.55);
        return;
      }

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      if (raycaster.intersectObjects(buttonHitTargets, false).length > 0) {
        renderer.domElement.style.cursor = 'pointer';
      } else if (raycaster.intersectObjects(shellHitTargets, false).length > 0) {
        renderer.domElement.style.cursor = 'grab';
      } else {
        renderer.domElement.style.cursor = 'default';
      }
    });

    function endPointerInteraction() {
      if (active3DPump) {
        setPumpState(active3DPump, false);
        active3DPump = null;
      }
      if (draggingShell) {
        draggingShell = false;
        state.userTiltX = 0;
        state.userTiltZ = 0;
        renderer.domElement.style.cursor = 'default';
      }
      controls.enabled = true;
    }

    window.addEventListener('pointerup', endPointerInteraction);
    window.addEventListener('pointercancel', endPointerInteraction);

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const curDpr = Math.min(window.devicePixelRatio || 1, 2);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(curDpr);
      renderer.setSize(w, h);
      composer.setSize(w, h);
      housingRT.setSize(Math.floor(w * curDpr), Math.floor(h * curDpr));
      backdropRT.setSize(Math.floor(w * curDpr), Math.floor(h * curDpr));
      tankSceneRT.setSize(Math.floor(w * curDpr), Math.floor(h * curDpr));
      globalRes.set(w * curDpr, h * curDpr);
    });

    // =========================================================================
    // 12. Multi-Stage Physical Optical Render Loop
    // =========================================================================
    resetRings(true);
    stepPhysics(0.016);
    updateWaterMeshes(0);

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const rawDt = (now - lastTime) * 0.001;
      lastTime = now;
      const dt = Math.min(0.033, Math.max(0.001, rawDt));
      state.time += dt;

      stepPhysics(dt);
      updateWaterMeshes(state.time);
      controls.update();

      // Stage 1A: Capture pure sunlit studio cyclorama + shadows + caustics into `backdropRT`
      deviceGroup.visible = false;
      renderer.setRenderTarget(backdropRT);
      renderer.render(scene, camera);

      // Stage 1B: Capture studio backdrop + internal shell ribs/bosses/valve (WITHOUT tank rings/bubbles) into `housingRT`
      // so the outer Glacier polycarbonate shell refracts ONLY studio + internal ribs — zero ring ghosting on outer walls!
      deviceGroup.visible = true;
      tankGroup.visible = false;
      for (let i = 0; i < pass3OnlyMeshes.length; i++) pass3OnlyMeshes[i].visible = false;
      renderer.setRenderTarget(housingRT);
      renderer.render(scene, camera);

      // Stage 2: Capture internal shell features + tank contact shadows, standoffs, rings, glass pegs & bubbles into `tankSceneRT`
      tankGroup.visible = true;
      renderer.setRenderTarget(tankSceneRT);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);

      // Stage 3: Full multi-bounce refraction (water, S-curve meniscus, clear tank bezel, Glacier polycarbonate shell, buttons) + Khronos PBR Neutral Grade!
      for (let i = 0; i < pass3OnlyMeshes.length; i++) pass3OnlyMeshes[i].visible = true;
      composer.render();
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
